<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>holocubic控制台</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="live.css"><link rel="stylesheet" href="files.css"></head>
<body>
<header class="titlebar"><div class="brand"><span data-icon="cube"></span><strong>holocubic控制台</strong><span class="demo-label" id="versionBadge">设备控制台</span></div><div class="window-controls"><button data-window="minimize" aria-label="最小化">&#x2500;</button><button data-window="maximize" aria-label="最大化"><span data-icon="square"></span></button><button data-window="close" aria-label="关闭"><span data-icon="x"></span></button></div></header>
<div class="toolbar"><button class="toolbar-button scan-button" data-action="scan"><span data-icon="search"></span><span id="scanLabel">扫描局域网设备</span></button><div class="device-picker"><button id="deviceSwitch" class="device-button" aria-expanded="false"><i class="dot offline"></i><b id="activeDeviceName">连接设备</b><span id="activeDeviceIp"></span><span data-icon="chevron"></span></button><div id="deviceMenu" class="popover hidden"></div></div><button class="toolbar-button add-device" data-action="add-device"><span data-icon="plus"></span>添加设备</button><i class="separator"></i><button class="icon-button" data-action="refresh" title="刷新" aria-label="刷新"><span data-icon="refresh"></span></button><div class="toolbar-spacer"></div><button class="toolbar-button" data-drawer="services"><span data-icon="monitor"></span>电脑服务</button><button class="toolbar-button" data-drawer="advanced"><span data-icon="tool"></span>高级工具</button><label class="app-language-control" title="PC App 语言"><span>◎</span><select data-ui-language data-no-i18n aria-label="PC App language"><option value="zh-CN">中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="de">Deutsch</option></select></label><button class="icon-button" data-drawer="settings" title="软件设置" aria-label="软件设置"><span data-icon="settings"></span></button></div>
<div class="workspace"><aside class="sidebar"><div class="web-brand"><span data-icon="cube"></span><div><b>Cubic</b><small>Launcher</small></div></div><nav><button data-page="home" class="active"><span data-icon="sliders"></span>设备控制</button><button data-page="files"><span data-icon="folder"></span>文件管理</button><button data-page="media"><span data-icon="image"></span>媒体资源</button><button data-page="store"><span data-icon="store"></span>应用商店</button><button data-page="network"><span data-icon="wifi"></span>网络</button></nav><div class="side-bottom"><div class="device-cube"><span data-icon="cube"></span></div><div><b id="sideDeviceName">Cubic S3 <i class="dot offline"></i></b><small id="sideIp"></small></div></div></aside><main id="main" tabindex="-1"></main></div>
<div id="drawerLayer" class="drawer-layer hidden"><div class="drawer-scrim" data-action="close-drawer"></div><aside id="drawer" class="drawer" role="dialog" aria-modal="true"></aside></div>
<div id="modalLayer" class="modal-layer hidden"><div class="modal-scrim" data-action="close-modal"></div><section id="modal" class="modal" role="dialog" aria-modal="true"></section></div>
<div id="toast" class="toast hidden" role="status"></div><script src="locales.js"></script><script src="i18n-ui.js"></script><script src="icons.js"></script><script src="timezones.js"></script><script src="app.js"></script><script src="services-ui.js"></script><script src="serial-ui.js"></script><script src="files-ui.js"></script>
</body></html>
